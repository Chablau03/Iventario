<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventário - RPG</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }

        /* Moldura original da Calculadora (Full Screen) */
        .inventory-frame {
            width: 100vw;
            height: 100vh;
            background-image: url('https://i.imgur.com/Zkj2oFh.png');
            background-size: 100% 100%; /* Preenche a tela toda */
            background-position: center;
            position: relative;
        }

        /* Container do Vídeo do Personagem (Lado Esquerdo) */
        .character-container {
            position: absolute;
            top: 50%;
            left: 25%; /* Posicionado no lado esquerdo da tela */
            transform: translate(-50%, -50%);
            width: 450px; 
            height: 550px; 
            z-index: 1;
        }

        .character-video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: transparent; 
        }

        /* Slots de Equipamento (4 quadradinhos) ao redor do personagem */
        .slot {
            width: 70px;
            height: 70px;
            background-image: url('https://i.imgur.com/Gi1TwZ7.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            position: absolute;
            z-index: 2;
            cursor: pointer;
            transition: transform 0.2s;
            outline: none; /* Remove a aura/borda ao clicar */
            -webkit-tap-highlight-color: transparent; /* Remove o destaque de toque em dispositivos móveis */
        }

        .slot:hover {
            transform: scale(1.08);
        }

        /* Posicionamento dos 4 slots ao redor do personagem */
        .slot-head { top: 20%; left: 18%; } /* Próximo da cabeça */
        .slot-left-hand { top: 45%; left: 15%; } /* Próximo da mão esquerda */
        
        .slot-shoulder { top: 33%; left: 31%; } /* Acima do cotovelo, abaixo do ombro */
        .slot-legs { top: 55%; left: 31%; } /* Altura do joelho */

        /* Container dos botões de ação */
        .buttons-container {
            position: absolute;
            top: 6%;
            right: 9%;
            display: flex;
            gap: 15px;
            z-index: 2;
        }

        .action-button {
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            cursor: pointer;
            transition: transform 0.2s;
            outline: none;
            -webkit-tap-highlight-color: transparent;
            
            /* Centralizando e estilizando o texto dentro do botão */
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8); /* Melhora a legibilidade */
        }

        .action-button:hover {
            transform: scale(1.08);
        }

        /* Configurações do botão da Mochila */
        .backpack-button {
            background-image: url('https://i.imgur.com/ucaeaSj.png');
            width: 150px;
            height: 150px;
            position: absolute;
            top: 12%;
            left: 42%;
            z-index: 10;
        }

        /* Botões de ação normais */
        .default-action-button {
            background-image: url('https://i.imgur.com/sK5SnCa.png');
            width: 200px;
            height: 200px;
        }

        /* Container dos Grids do Inventário (16 slots organizados em 4x4) */
        .inventory-grid {
            position: absolute;
            top: 20%;
            right: 18%;
            width: 530px;
            height: 640px;
            display: grid;
            grid-template-columns: repeat(4, 120px);
            grid-template-rows: repeat(4, 120px);
            gap: 40px;
            z-index: 2;
        }

        .grid-slot {
            width: 250px;
            height: 250px;
            background-image: url('https://i.imgur.com/b0XLgVU.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            cursor: pointer;
            transition: transform 0.2s;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        .grid-slot:hover {
            transform: scale(1.08);
        }
    </style>
</head>

        <button onclick="consultarLista()" style="position: absolute; bottom: 30px; left: 30px; z-index: 10; padding: 15px 25px; background-color: #e67e22; color: #fff; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.4);">

    <script src="lista.js" defer></script>

    <script>
        function showGrid(gridId) {
            const grids = document.querySelectorAll('.inventory-grid');
            grids.forEach(grid => {
                grid.style.display = 'none';
            });

            const targetGrid = document.getElementById(gridId);
            if (targetGrid) {
                targetGrid.style.display = 'grid';
            }
        }

        // Função para testar a comunicação com a lista de itens
        function consultarLista() {
            try {
                if (typeof bancoDeItens !== 'undefined' && Array.isArray(bancoDeItens) && bancoDeItens.length > 0) {
                    // Mapeia o nome dos itens para exibir no alerta
                    const nomesItens = bancoDeItens.map(item => item.nome).join(', ');
                    alert("Lista consultada com sucesso!\nItens no catálogo: " + bancoDeItens.length + "\n" + nomesItens);
                    console.log("Catálogo de itens:", bancoDeItens);
                } else {
                    alert("Erro: O bancoDeItens não foi encontrado, está vazio ou o arquivo não está no mesmo diretório.");
                }
            } catch (error) {
                alert("Erro ao consultar a lista: " + error.message);
                console.error("Erro na consulta:", error);
            }
        }
    </script>
