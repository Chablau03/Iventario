<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventário - RPG</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Moldura original da Calculadora (Full Screen) */
        .inventory-frame {
            width: 100vw;
            height: 100vh;
            background-image: url('https://i.imgur.com/Zkj2oFh.png');
            background-size: 100% 100%;
            background-position: center;
            position: relative;
        }

        /* Overlay para desativar a tela ao abrir o menu */
        .inventory-overlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.4);
            z-index: 1;
            pointer-events: auto;
        }

        /* Container do modo de jogo e controle de acesso */
        .mode-container {
            position: absolute;
            top: 4%;
            left: 4%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .mode-badge {
            padding: 8px 14px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.5);
        }

        .mode-adm {
            background-color: #c0392b;
            color: white;
        }

        .mode-player {
            background-color: #27ae60;
            color: white;
        }

        .btn-mode {
            background-color: #333;
            color: #fff;
            border: 1px solid #555;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.4);
        }

        .btn-mode:hover {
            background-color: #444;
        }

        /* Painel para selecionar e adicionar itens da lista */
        .admin-panel {
            position: absolute;
            top: 18%;
            left: 4%;
            background-color: rgba(34, 34, 34, 0.95);
            border: 1px solid #555;
            padding: 12px;
            border-radius: 8px;
            z-index: 10;
            width: 280px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .admin-panel h3 {
            color: #e67e22;
            font-size: 14px;
            text-align: center;
            margin-bottom: 2px;
        }

        .admin-panel select, .admin-panel option {
            padding: 6px;
            background: #222;
            color: #fff;
            border: 1px solid #444;
            border-radius: 4px;
            font-size: 12px;
            width: 100%;
        }

        .btn-add-item {
            background-color: #e67e22;
            color: white;
            border: none;
            padding: 8px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-add-item:hover {
            background-color: #d35400;
        }

        /* Container do botão inferior laranja */
        .bottom-container {
            position: absolute;
            bottom: 4%;
            left: 4%;
            z-index: 10;
        }

        .orange-action-button {
            background-color: #e67e22;
            background-image: none;
            color: #ffffff;
            width: 180px;
            height: 60px;
            border: 2px solid #d35400;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            transition: background-color 0.2s, transform 0.2s;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        .orange-action-button:hover {
            background-color: #d35400;
            transform: scale(1.05);
        }

        /* Container do Vídeo do Personagem (Lado Esquerdo) */
        .character-container {
            position: absolute;
            top: 50%;
            left: 25%;
            transform: translate(-50%, -50%);
            width: 450px; 
            height: 550px; 
            z-index: 1;
        }

        .character-video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: transparent; 
        }

        /* Slots de Equipamento ao redor do personagem */
        .slot {
            width: 90px;
            height: 90px;
            background-image: url('https://i.imgur.com/Gi1TwZ7.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            position: absolute;
            z-index: 2;
            cursor: pointer;
            transition: transform 0.2s;
            outline: none;
            -webkit-tap-highlight-color: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .slot:hover {
            transform: scale(1.08);
        }

        .slot img {
            width: 60%;
            height: 60%;
            object-fit: contain;
        }

        .slot-head { top: 15%; left: 15%; }
        .slot-left-hand { top: 45%; left: 10%; }
        .slot-shoulder { top: 30%; left: 28%; }
        .slot-legs { top: 60%; left: 28%; }

        /* Container dos botões de ação */
        .buttons-container {
            position: absolute;
            top: 6%;
            right: 9%;
            display: flex;
            gap: 15px;
            z-index: 2;
        }

        .action-button {
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            cursor: pointer;
            transition: transform 0.2s;
            outline: none;
            -webkit-tap-highlight-color: transparent;
            
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 14px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
        }

        .action-button:hover {
            transform: scale(1.08);
        }

        .backpack-button {
            background-image: url('https://i.imgur.com/ucaeaSj.png');
            width: 140px;
            height: 140px;
            position: absolute;
            top: 10%;
            left: 42%;
            z-index: 10;
        }

        .default-action-button {
            background-image: url('https://i.imgur.com/sK5SnCa.png');
            width: 180px;
            height: 180px;
        }

        /* Container dos Grids do Inventário */
        .inventory-grid {
            position: absolute;
            top: 22%;
            right: 18%;
            width: 530px;
            height: 640px;
            display: grid;
            grid-template-columns: repeat(4, 120px);
            grid-template-rows: repeat(4, 120px);
            gap: 40px;
            z-index: 2;
        }

        .grid-slot {
            width: 220px;
            height: 220px;
            background-image: url('https://i.imgur.com/b0XLgVU.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            cursor: pointer;
            transition: transform 0.2s;
            outline: none;
            -webkit-tap-highlight-color: transparent;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .grid-slot:hover {
            transform: scale(1.03);
        }

        .grid-slot img {
            width: 55%;
            height: 55%;
            object-fit: contain;
        }

        .item-menu {
            display: none;
            position: absolute;
            top: 95%;
            left: 50%;
            transform: translateX(-50%);
            background-color: #222;
            border: 1px solid #444;
            border-radius: 6px;
            padding: 6px;
            z-index: 105;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.8);
            width: 160px;
            flex-direction: column;
            gap: 5px;
        }

        .item-menu button {
            background: #333;
            color: #fff;
            border: none;
            padding: 6px;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
            text-align: left;
            width: 100%;
        }

        .item-menu button:hover {
            background: #444;
        }

        .overlay-active .slot,
        .overlay-active .action-button,
        .overlay-active .mode-container,
        .overlay-active .grid-slot,
        .overlay-active .admin-panel {
            pointer-events: none;
            filter: brightness(0.6);
        }

        .overlay-active .inventory-overlay {
            display: block;
        }

        .overlay-active .grid-slot.active-slot,
        .overlay-active .slot.active-slot {
            pointer-events: auto;
            filter: none;
            z-index: 100;
        }
    </style>
</head>
<body>

    <script src="lista.js"></script>

    <div class="inventory-frame">
        
        <div id="inventory-overlay" class="inventory-overlay" onclick="fecharMenus()"></div>

        <div class="mode-container">
            <div id="badge-modo" class="mode-badge mode-adm">Modo ADM Ativo</div>
            <button class="btn-mode" onclick="alternarModo()">Alternar Modo</button>
        </div>

        <div class="admin-panel">
            <h3>Adicionar Item</h3>
            <select id="item-selecionado">
                </select>
            <button class="btn-add-item" onclick="adicionarItemDaLista()">Adicionar ao Inventário</button>
        </div>

        <div class="bottom-container">
            <button class="action-button orange-action-button" title="Conferir Lista" onclick="conferirLista()">Conferir Lista</button>
        </div>

        <div class="character-container">
            <video class="character-video" src="https://www.dropbox.com/scl/fi/rs8zvfldjjbpq3qsiiwzh/lv_0_20260504020207.mp4?rlkey=t0ghvqvj3caif79f8gr28b8sy&st=e02pb33e&raw=1" autoplay loop muted playsinline></video>
        </div>

        <div class="slot slot-head" title="Cabeça"></div>
        <div class="slot slot-left-hand" title="Mão Esquerda"></div>
        <div class="slot slot-shoulder" title="Equipamento de Braço"></div>
        <div class="slot slot-legs" title="Calças"></div>

        <div class="action-button backpack-button" title="Inventário do Aventureiro" onclick="showGrid('grid-adventurer')"></div>

        <div id="botoes-topo" class="buttons-container">
            <div class="action-button default-action-button" title="Equipamentos" onclick="showGrid('grid-equipments')">Equipamento</div>
            <div class="action-button default-action-button" title="Itens" onclick="showGrid('grid-items')">Item</div>
            <div class="action-button default-action-button" title="Materiais" onclick="showGrid('grid-materials')">Materiais</div>
        </div>

        <div id="grid-adventurer" class="inventory-grid" style="display: none;"></div>
        <div id="grid-equipments" class="inventory-grid" style="display: grid;"></div>
        <div id="grid-items" class="inventory-grid" style="display: none;"></div>
        <div id="grid-materials" class="inventory-grid" style="display: none;"></div>

    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDJ8TOv0bkTE7my0VEVv1LtPIkukGPhKbM",
            authDomain: "rpg-mesa-4c8ef.firebaseapp.com",
            databaseURL: "https://rpg-mesa-4c8ef-default-rtdb.firebaseio.com",
            projectId: "rpg-mesa-4c8ef",
            storageBucket: "rpg-mesa-4c8ef.firebasestorage.app",
            messagingSenderId: "270738612946",
            appId: "1:270738612946:web:7ee64ed841288f3719c30b",
            measurementId: "G-PJ8H64V8KB"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        // Exporta para uso global no script
        window.db = db;
        window.doc = doc;
        window.setDoc = setDoc;

        console.log("Firebase e Firestore inicializados com sucesso!");
    </script>

    <script>
        function getEmptyGrid() {
            let grid = [];
            for (let i = 0; i < 16; i++) {
                grid.push({});
            }
            return grid;
        }

        // Inicia com os grids vazios
        let gridEquipamentos = getEmptyGrid();
        let gridMochila = getEmptyGrid();
        let gridItens = getEmptyGrid();
        let gridMateriais = getEmptyGrid();

        let equippedItems = {
            head: {},
            left_hand: {},
            shoulder: {},
            legs: {}
        };

        let modoAtual = "adm";

        // Preenche o menu suspenso ao carregar a página
        document.addEventListener("DOMContentLoaded", () => {
            const select = document.getElementById('item-selecionado');
            if (select && typeof bancoDeItens !== 'undefined') {
                bancoDeItens.forEach(item => {
                    const option = document.createElement('option');
                    option.value = item.id;
                    option.textContent = item.nome;
                    select.appendChild(option);
                });
            }
            atualizarTudo();
        });

        async function adicionarItemDaLista() {
            const select = document.getElementById('item-selecionado');
            const itemSelecionadoId = select.value;

            if (typeof bancoDeItens === 'undefined') {
                alert("A variável bancoDeItens não está definida.");
                return;
            }

            // Encontra o item em `bancoDeItens` (lista.js)
            const itemOriginal = bancoDeItens.find(item => item.id === itemSelecionadoId);

            if (!itemOriginal) {
                alert("Nenhum item selecionado ou a lista está vazia.");
                return;
            }

            // Cria um identificador único para o banco de dados
            const itemParaAdicionar = {
                id: itemOriginal.id + "_" + Date.now(),
                nome: itemOriginal.nome,
                tipo: itemOriginal.tipo,
                img: itemOriginal.imagem || itemOriginal.img,
                valor: itemOriginal.valor,
                timestamp: new Date().toISOString()
            };

            const gridArray = getGridArray(itemParaAdicionar.tipo);
            const targetIndex = gridArray.findIndex(slot => !slot.id);

            if (targetIndex !== -1) {
                gridArray[targetIndex] = itemParaAdicionar;
                atualizarTudo();

                // Envia para o banco de dados
                try {
                    await window.setDoc(window.doc(window.db, "inventario", itemParaAdicionar.id), itemParaAdicionar);
                    alert("Item movido para a calculadora e registrado no banco de dados com sucesso!");
                } catch (error) {
                    console.error("Erro ao salvar no Firestore: ", error);
                    alert("Item adicionado ao grid local, mas ocorreu um erro ao salvar no banco de dados.");
                }
            } else {
                alert("A aba do inventário está cheia!");
            }
        }

        function conferirLista() {
            if (typeof bancoDeItens !== 'undefined' && bancoDeItens.length > 0) {
                let nomes = bancoDeItens.map(i => `- ${i.nome}`).join('\n');
                alert('Lista conectada com sucesso!\nItens encontrados:\n' + nomes);
            } else {
                alert('A lista (bancoDeItens) não está definida ou está vazia.');
            }
        }

        function alternarModo() {
            const badge = document.getElementById('badge-modo');
            const botoesTopo = document.getElementById('botoes-topo');

            if (modoAtual === "adm") {
                modoAtual = "aventureiro";
                badge.className = "mode-badge mode-player";
                badge.textContent = "Modo Aventureiro Ativo";
                botoesTopo.style.display = "none";
                
                fecharMenus();
                showGrid('grid-adventurer');
            } else {
                modoAtual = "adm";
                badge.className = "mode-badge mode-adm";
                badge.textContent = "Modo ADM Ativo";
                botoesTopo.style.display = "flex";
                
                showGrid('grid-equipments');
            }
            atualizarTudo();
        }

        function showGrid(gridId) {
            if (modoAtual === "aventureiro" && gridId !== 'grid-adventurer') return;

            const grids = document.querySelectorAll('.inventory-grid');
            grids.forEach(grid => {
                grid.style.display = 'none';
            });

            const targetGrid = document.getElementById(gridId);
            if (targetGrid) {
                targetGrid.style.display = 'grid';
            }
        }

        function getGridArray(gridId) {
            switch(gridId) {
                case 'grid-equipments': return gridEquipamentos;
                case 'grid-adventurer': return gridMochila;
                case 'grid-items': return gridItens;
                case 'grid-materials': return gridMateriais;
                default: return gridEquipamentos;
            }
        }

        function atualizarTudo() {
            renderGrid('grid-equipments', gridEquipamentos);
            renderGrid('grid-adventurer', gridMochila);
            renderGrid('grid-items', gridItens);
            renderGrid('grid-materials', gridMateriais);
            atualizarEquipados();
        }

        function renderGrid(gridId, itemsArray) {
            const grid = document.getElementById(gridId);
            grid.innerHTML = '';
            
            for (let i = 0; i < 16; i++) {
                const item = itemsArray[i];
                const slotDiv = document.createElement('div');
                slotDiv.className = 'grid-slot';
                
                if (item && item.id) {
                    slotDiv.title = item.nome;
                    slotDiv.innerHTML = `
                        <img src="${item.img}" alt="${item.nome}">
                        ${criarMenuGrid(gridId, i, item)}
                    `;
                } else {
                    slotDiv.title = "Slot Vazio";
                }
                
                grid.appendChild(slotDiv);
            }
        }

        function criarMenuGrid(gridId, index, item) {
            let menuHtml = `
                <div class="item-menu" id="menu-${item.id}-${index}">
                    <button class="btn-equipar" data-grid="${gridId}" data-index="${index}">Equipar</button>
                    <button class="btn-excluir" data-grid="${gridId}" data-index="${index}">Excluir</button>
            `;
            
            if (gridId === 'grid-adventurer') {
                if (modoAtual !== "aventureiro") {
                    menuHtml += `<button class="btn-mover-original" data-index="${index}">Mover para original</button>`;
                }
            } else {
                menuHtml += `<button class="btn-mover" data-grid="${gridId}" data-index="${index}">Mover para Mochila</button>`;
            }
            
            menuHtml += `</div>`;
            return menuHtml;
        }

        function getSlotForItem(item) {
            const nome = item.nome ? item.nome.toLowerCase() : "";
            if (nome.includes('capuz') || nome.includes('gorro') || nome.includes('capacete')) {
                return 'head';
            } else if (nome.includes('luva') || nome.includes('mão') || nome.includes('braço')) {
                return 'left_hand';
            } else if (nome.includes('peitoral') || nome.includes('manto')) {
                return 'shoulder';
            } else if (nome.includes('calça')) {
                return 'legs';
            }
            return 'shoulder'; 
        }

        function equiparItem(gridId, index) {
            if (modoAtual !== "adm" && gridId !== 'grid-adventurer') return;
            
            let fromArray = getGridArray(gridId);
            let item = fromArray[index];

            if (item && item.id) {
                let slotName = getSlotForItem(item);
                
                let existingItem = equippedItems[slotName];
                if (existingItem && existingItem.id) {
                    let firstEmpty = fromArray.findIndex(slot => !slot.id);
                    if (firstEmpty !== -1) {
                        fromArray[firstEmpty] = existingItem;
                    }
                }

                equippedItems[slotName] = item;
                fromArray[index] = {};
            }
            fecharMenus();
            atualizarTudo();
        }

        function desequiparItem(slotName) {
            if (modoAtual !== "adm") return;
            
            let item = equippedItems[slotName];
            if (item && item.id) {
                let targetIndex = gridMochila.findIndex(slot => !slot.id);
                
                if (targetIndex !== -1) {
                    gridMochila[targetIndex] = item;
                    equippedItems[slotName] = {};
                } else {
                    let targetGrid = item.origemGrid || 'grid-equipments';
                    let targetArray = getGridArray(targetGrid);
                    let targetIndex = targetArray.findIndex(slot => !slot.id);
                    if (targetIndex !== -1) {
                        targetArray[targetIndex] = item;
                        equippedItems[slotName] = {};
                    }
                }
            }
            fecharMenus();
            atualizarTudo();
        }

        function moverParaMochila(fromGrid, index) {
            if (modoAtual !== "adm") return;
            let fromArray = getGridArray(fromGrid);
            let item = fromArray[index];
            
            if (item && item.id) {
                let targetIndex = gridMochila.findIndex(slot => !slot.id);
                if (targetIndex !== -1) {
                    item.origemGrid = fromGrid; 
                    gridMochila[targetIndex] = item;
                    fromArray[index] = {};
                    atualizarTudo();
                }
            }
            fecharMenus();
        }

        function moverItemParaOrigem(index) {
            if (modoAtual !== "adm") return;
            let item = gridMochila[index];
            
            if (item && item.id) {
                let targetGrid = item.origemGrid || 'grid-equipments';
                let targetArray = getGridArray(targetGrid);
                let targetIndex = targetArray.findIndex(slot => !slot.id);
                
                if (targetIndex !== -1) {
                    targetArray[targetIndex] = item;
                    gridMochila[index] = {};
                    atualizarTudo();
                }
            }
            fecharMenus();
        }

        function excluirItem(gridId, index) {
            if (modoAtual !== "adm" && gridId !== 'grid-adventurer') return;
            
            let grid = getGridArray(gridId);
            grid[index] = {};
            
            fecharMenus();
            atualizarTudo();
        }

        function atualizarEquipados() {
            const slots = {
                'Cabeça': document.querySelector('.slot-head'),
                'Mão Esquerda': document.querySelector('.slot-left-hand'),
                'Equipamento de Braço': document.querySelector('.slot-shoulder'),
                'Calças': document.querySelector('.slot-legs')
            };

            for (const [title, element] of Object.entries(slots)) {
                element.innerHTML = '';
                element.title = title;
            }

            for (const [key, item] of Object.entries(equippedItems)) {
                if (item && item.id) {
                    let element = null;
                    if (key === 'head') element = slots['Cabeça'];
                    else if (key === 'left_hand') element = slots['Mão Esquerda'];
                    else if (key === 'shoulder') element = slots['Equipamento de Braço'];
                    else if (key === 'legs') element = slots['Calças'];

                    if (element) {
                        element.innerHTML = `
                            <img src="${item.img}" alt="${item.nome}">
                            <div class="item-menu" id="menu-equip-${key}">
                                <button class="btn-desequipar" data-slot="${key}">Desequipar</button>
                            </div>
                        `;
                        element.title = item.nome;
                    }
                }
            }

            verificarSetCompleto();
        }

        function verificarSetCompleto() {
            const videoElement = document.querySelector('.character-video');
            
            const isSetComplete = 
                equippedItems.head.id && 
                equippedItems.left_hand.id && 
                equippedItems.shoulder.id && 
                equippedItems.legs.id;
            
            const setCompletoUrl = 'https://www.dropbox.com/scl/fi/pivdefvi0ldfn8fpl7n9e/vid_download_20260505194159_501935.mp4?rlkey=9ddppb2oq67ydzegbgnuqc553&st=9sam6d35&raw=1';
            const setPadraoUrl = 'https://www.dropbox.com/scl/fi/rs8zvfldjjbpq3qsiiwzh/lv_0_20260504020207.mp4?rlkey=t0ghvqvj3caif79f8gr28b8sy&st=e02pb33e&raw=1';

            if (isSetComplete) {
                if (!videoElement.src.includes('pivdefvi0ldfn8fpl7n9e')) {
                    videoElement.src = setCompletoUrl;
                    videoElement.load();
                    videoElement.play().catch(e => console.log('Erro ao reproduzir vídeo:', e));
                }
            } else {
                if (!videoElement.src.includes('rs8zvfldjjbpq3qsiiwzh')) {
                    videoElement.src = setPadraoUrl;
                    videoElement.load();
                    videoElement.play().catch(e => console.log('Erro ao reproduzir vídeo:', e));
                }
            }
        }

        function fecharMenus() {
            const frame = document.querySelector('.inventory-frame');
            if (frame) {
                frame.classList.remove('overlay-active');
            }

            document.querySelectorAll('.item-menu').forEach(m => m.style.display = 'none');

            document.querySelectorAll('.grid-slot, .slot').forEach(s => {
                s.classList.remove('active-slot');
                s.style.zIndex = '';
            });
        }

        document.addEventListener("click", (e) => {
            if (e.target.closest('.item-menu')) {
                const btn = e.target;
                
                if (btn.classList.contains('btn-equipar')) {
                    e.stopPropagation();
                    fecharMenus();
                    equiparItem(btn.dataset.grid, parseInt(btn.dataset.index));
                } else if (btn.classList.contains('btn-excluir')) {
                    e.stopPropagation();
                    fecharMenus();
                    excluirItem(btn.dataset.grid, parseInt(btn.dataset.index));
                } else if (btn.classList.contains('btn-mover')) {
                    e.stopPropagation();
                    fecharMenus();
                    moverParaMochila(btn.dataset.grid, parseInt(btn.dataset.index));
                } else if (btn.classList.contains('btn-mover-original')) {
                    e.stopPropagation();
                    fecharMenus();
                    moverItemParaOrigem(parseInt(btn.dataset.index));
                } else if (btn.classList.contains('btn-desequipar')) {
                    e.stopPropagation();
                    fecharMenus();
                    desequiparItem(btn.dataset.slot);
                }
                return;
            }

            const slot = e.target.closest('.grid-slot') || e.target.closest('.slot');
            if (slot) {
                e.stopPropagation();
                
                if (slot.classList.contains('slot')) {
                    if (modoAtual === "aventureiro") return;
                    if (!slot.querySelector('img')) return;

                    const menu = slot.querySelector('.item-menu');
                    if (menu && menu.style.display === 'flex') {
                        fecharMenus();
                    } else {
                        fecharMenus();
                        const frame = document.querySelector('.inventory-frame');
                        if (frame) {
                            frame.classList.add('overlay-active');
                        }
                        slot.classList.add('active-slot');
                        slot.style.zIndex = '100';
                        if (menu) {
                            menu.style.display = 'flex';
                        }
                    }
                    return;
                }

                if (modoAtual === "aventureiro" && !slot.closest('#grid-adventurer')) return;

                const menu = slot.querySelector('.item-menu');
                if (menu && menu.style.display === 'flex') {
                    fecharMenus();
                } else {
                    fecharMenus();

                    const frame = document.querySelector('.inventory-frame');
                    if (frame) {
                        frame.classList.add('overlay-active');
                    }

                    slot.classList.add('active-slot');
                    slot.style.zIndex = '100';

                    if (menu) {
                        menu.style.display = 'flex';
                    }
                }
            } else {
                fecharMenus();
            }
        });
    </script>
</body>
</html>
